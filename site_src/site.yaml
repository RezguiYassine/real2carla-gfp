  - >-
    Real2CARLA-GFP turns an uncalibrated CCTV recording of a traffic accident
    into a CARLA simulation that can be replayed, filmed from any viewpoint and
    changed.
  - >-
    From a single frame it recovers the camera pose and maps every tracked road
    user to metres on the road, without clicked points or a site map: a median
    error of 3.26 m in simulation and 2.15 m on real roadside cameras.
