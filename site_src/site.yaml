    A scenario that a person confirms then constrains the scene, the motion and
    a physics collision solver. Over six review iterations on 76 CADP videos,
    the reconstructions a reviewer rated good rose from 37 to 66.

abstract: >-
  Rebuilding a real traffic accident as an executable simulation requires
  identity-consistent trajectories, a metric ground mapping, and a collision
  that happens as it did. Real2CARLA-GFP is a trajectory-centric pipeline that
  turns uncalibrated CCTV recordings of accidents into CARLA scenarios, and
  this article measures each of its stages. Four multi-object trackers on real
  accident footage reach similar accuracy, and none keeps both colliding road
  users under one identity in most videos, which justifies interactive
  correction. Exact ground truth from 1,113 simulated scenes overturns two
  choices of our conference pipeline: a Jacobian correction raises the
  localization error of a clicked homography from 1.03 to 41.77 m, and
  support-vector regression estimates speed about four times more accurately
  than a statistical ensemble. Clicked correspondences are fragile and, on a
  stand-in simulator road, do not exist. A geometry-first projection therefore
  recovers the camera pose from one frame and derives the homography in closed
  form. Without clicks or a site map, it places vehicles within 40 m of the
  camera with a median error of 3.26 m in simulation, as accurately as four
  clicks on a metric map of the true site, and of 2.15 m on real roadside
  cameras. A scenario that a person confirms then constrains scene choice,
  motion, and a physics collision solver. Over six review iterations on 76
  CADP videos, the reconstructions that a human reviewer rated good rose from
  37 to 66, and an automatic scorecard agreed with the reviewer on 95.3 % of
  its judged verdicts.

